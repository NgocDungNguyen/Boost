    .custom-shadow { box-shadow: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -1px rgba(0,0,0,.06); }

    /* ---- segmented control ---- */
    .seg { display:inline-flex; background:#f3f4f6; border-radius:8px; padding:3px; gap:2px; }
    .seg-btn { transition: all .12s ease; border-radius:6px; cursor:pointer; }
    .seg-btn.active { background:#fff; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

    /* ---- toggle switch ---- */
    .toggle-track { transition: background-color .15s ease; }
    .toggle-knob { transition: transform .15s ease; }

    /* ---- projects table ---- */
    .rule-row.dragging { opacity: .4; }
    .rule-row td { vertical-align: middle; }
    .drag-handle { cursor: grab; }

    .badge { display:inline-flex; align-items:center; font-size:11px; font-weight:600; padding:2px 9px; border-radius:9999px; }
    .badge-boost  { background:#dbeafe; color:#1d4ed8; }
    .badge-demote { background:#fef9c3; color:#854d0e; }
    .badge-hide   { background:#ffedd5; color:#9a3412; }
    .badge-off    { background:#f3f4f6; color:#9ca3af; }

    .type-panel.hidden { display:none; }

    /* ---- rule priority pills (Boost / Demote / Hide order) ---- */
    .rule-pill { display:inline-flex; align-items:center; gap:8px; background:#fff; border:1px solid #e5e7eb; border-radius:9999px; padding:6px 12px 6px 8px; cursor:pointer; user-select:none; transition: border-color .12s ease, box-shadow .12s ease, background-color .12s ease; }
    .rule-pill:hover { background:#f9fafb; }
    .rule-pill.dragging { opacity:.4; }
    .rule-pill.drop-target { border-color:#9ca3af; }
    .rule-pill.active-boost  { border-color:#2563eb; box-shadow:0 0 0 1px #2563eb inset; }
    .rule-pill.active-demote { border-color:#eab308; box-shadow:0 0 0 1px #eab308 inset; }
    .rule-pill.active-hide   { border-color:#f97316; box-shadow:0 0 0 1px #f97316 inset; }
    .rule-pill-handle { cursor:grab; color:#d1d5db; font-size:11px; }
    .rule-pill-handle:active { cursor:grabbing; }
    .rule-pill-order { width:18px; height:18px; border-radius:9999px; background:#f3f4f6; color:#6b7280; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .rule-pill.active-boost  .rule-pill-order { background:#dbeafe; color:#1d4ed8; }
    .rule-pill.active-demote .rule-pill-order { background:#fef9c3; color:#854d0e; }
    .rule-pill.active-hide   .rule-pill-order { background:#ffedd5; color:#9a3412; }
    .rule-pill-name { font-size:12px; font-weight:600; color:#374151; }

    .chip { display:inline-flex; align-items:center; gap:6px; background:#f3f4f6; border:1px solid #e5e7eb; border-radius:9999px; padding:3px 10px 3px 12px; font-size:11px; color:#374151; }
    .chip button { color:#9ca3af; }
    .chip button:hover { color:#4b5563; }

    .cond-group { background:#fafafa; border:1px solid #e5e7eb; border-radius:12px; }
    .cond-group.dragging { opacity:.4; }
    .group-drag-handle { cursor:grab; }

function uniqueValues(list, field) {
    const set = new Set();
    list.forEach(p => {
        const v = p[field];
        if (Array.isArray(v)) v.forEach(x => set.add(x)); else if (v) set.add(v);
    });
    return [...set].sort();
}

function getAttrConfig(mode, scopedProducts) {
    const cfg = {
        'Product title':    { operators:['is'] },
        'Product Type':     { operators:['is'], options: uniqueValues(scopedProducts, 'type') },
        'Product Category': { operators:['is'], options: uniqueValues(scopedProducts, 'category') },
        'Vendor':           { operators:['is'], options: uniqueValues(scopedProducts, 'vendor') },
        'Product Tag':      { operators:['is'], options: uniqueValues(scopedProducts, 'tags') },
        'Metafield':        { operators:['is'], options: METAFIELDS },
        'Inventory':        { operators:['is','<=','=','>='] },
        'Price':            { operators:['=','<=','>='] },
        'Date published':   { operators:['Before','After'] }
    };
    if (mode === 'search') cfg['Collection'] = { operators:['is'], options: COLLECTIONS };
    return cfg;
}

function escapeAttr(str) {
    return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
}

let condIdSeq = 1;
function newCondition() {
    return { id: condIdSeq++, attr:'Product title', operator:'is', value:'' };
}
function newGroup(existingGroups) {
    const list = existingGroups || [];
    const names = new Set(list.map(g => g.name.trim().toLowerCase()));
    let n = list.length + 1;
    while (names.has(`condition group ${n}`.toLowerCase())) n++;
    return { id: condIdSeq++, name: `Condition Group ${n}`, conditions: [newCondition()] };
}

function blankRule() {

function loadProjects(key, seed) {
    try {
        const raw = localStorage.getItem(key);
        if (raw) return JSON.parse(raw);
    } catch (e) {}
    try { localStorage.setItem(key, JSON.stringify(seed)); } catch (e) {}
    return seed;
}
function saveProjects(key, list) {
    try { localStorage.setItem(key, JSON.stringify(list)); } catch (e) {}
}

// ==================== RULE EDITOR (one per mode+type) ====================
function initRuleEditor(mode, type, ctx) {
    const sfx = `${mode}-${type}`;
    const $ = name => document.getElementById(`${name}-${sfx}`);

    let state = blankRule();
    state.groups = [newGroup()];
    let selectedProducts = new Set();
    let productQuery = '';

    // ---------- enable toggle ----------
    $('type-toggle').addEventListener('click', () => setEnabled(!state.enabled));

    function setEnabled(on) {
        state.enabled = on;
        const track = $('type-toggle');
        const knob = track.querySelector('.toggle-knob');
        track.classList.toggle('bg-emerald-500', on);
        track.classList.toggle('bg-gray-200', !on);
        knob.classList.toggle('translate-x-4', on);
        knob.classList.toggle('translate-x-0', !on);
        $('type-body').classList.toggle('hidden', !on);
        $('type-off-note').classList.toggle('hidden', on);
        ctx.onEnabledChange();
    }

    // ---------- product mode ----------
    function syncSeg(radioName) {
        document.querySelectorAll(`input[name="${radioName}-${sfx}"]`).forEach(r => {
            const label = r.closest('.seg-btn');
            label.classList.toggle('active', r.checked);
            label.classList.toggle('text-gray-900', r.checked);
            label.classList.toggle('text-gray-500', !r.checked);
        });
    }

    document.querySelectorAll(`input[name="product-mode-${sfx}"]`).forEach(r => r.addEventListener('change', () => setProductMode(r.value)));

    function setProductMode(pmode) {
        state.productMode = pmode;
        document.querySelectorAll(`input[name="product-mode-${sfx}"]`).forEach(r => { r.checked = r.value === pmode; });
        syncSeg('product-mode');
        $('specific-products-panel').classList.toggle('hidden', pmode !== 'specific');
        $('attributes-panel').classList.toggle('hidden', pmode !== 'attributes');
        renderPreview();
    }

    // ---------- product picker ----------
    $('product-search').addEventListener('input', e => { productQuery = e.target.value; renderProductList(); });

    function renderProductList() {
        const q = productQuery.toLowerCase();
        const list = $('product-list');
        const scoped = ctx.getScopedProducts();
        const filtered = scoped.filter(p => p.name.toLowerCase().includes(q));
        const atMax = selectedProducts.size >= MAX_PRODUCTS;

        if (scoped.length === 0) {
            list.innerHTML = `<div class="text-center text-xs text-gray-400 py-8">Select a collection on the left to see its products.</div>`;
            return;
        }
        if (filtered.length === 0) {
            list.innerHTML = `<div class="text-center text-xs text-gray-400 py-8">No products match "${productQuery}"</div>`;
            return;
        }
        list.innerHTML = filtered.map(p => {
            const checked = selectedProducts.has(p.id);
            const disabled = atMax && !checked;
            return `
            <label class="prod-row flex items-center gap-3 px-3 py-2.5 ${disabled ? 'opacity-40 cursor-not-allowed' : 'cursor-pointer'}">
                <input type="checkbox" data-id="${p.id}" class="prod-checkbox w-3.5 h-3.5 border-gray-300 rounded text-zinc-800 focus:ring-zinc-800" ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''}>
                <span class="w-8 h-8 rounded-lg shrink-0" style="background:${p.color}"></span>
                <span class="flex-1 text-xs text-gray-700 truncate">${p.name}</span>
                <span class="text-xs text-gray-400">$${p.price.toFixed(2)}</span>
            </label>`;
        }).join('');
        list.querySelectorAll('.prod-checkbox').forEach(cb => cb.addEventListener('change', () => {
            const id = Number(cb.dataset.id);
            if (cb.checked) {
                if (selectedProducts.size >= MAX_PRODUCTS) { cb.checked = false; return; }
                selectedProducts.add(id);
            } else selectedProducts.delete(id);
            renderSelectedChips();
            renderProductList();
            renderPreview();
        }));
    }

    function renderSelectedChips() {
        const wrap = $('selected-chips');
        const ids = [...selectedProducts];
        $('selected-count').textContent = `${ids.length}/${MAX_PRODUCTS} selected`;
        wrap.innerHTML = ids.map(id => {
            const p = PRODUCTS.find(x => x.id === id);
            return `<span class="chip">${p.name}<button data-id="${id}" class="remove-prod-btn"><i class="fas fa-times text-[9px]"></i></button></span>`;
        }).join('');
        wrap.querySelectorAll('.remove-prod-btn').forEach(btn => btn.addEventListener('click', () => {
            selectedProducts.delete(Number(btn.dataset.id));
            renderSelectedChips();
            renderProductList();
            renderPreview();
        }));
    }

    // ---------- attribute condition groups ----------
    function renderConditionValueControl(groupId, cond) {
        const cfg = getAttrConfig(mode, ctx.getScopedProducts())[cond.attr];
        let operatorHtml;
        if (cfg.operators.length > 1) {
            operatorHtml = `<div class="relative shrink-0">
                <select class="cond-operator border border-gray-300 rounded-md pl-2 pr-6 py-1.5 text-xs appearance-none bg-white" data-group="${groupId}" data-cond="${cond.id}">
                    ${cfg.operators.map(op => `<option value="${op}" ${op === cond.operator ? 'selected' : ''}>${op}</option>`).join('')}
                </select>
                <div class="absolute inset-y-0 right-0 flex items-center pr-1.5 pointer-events-none text-gray-400"><i class="fas fa-chevron-down text-[9px]"></i></div>
            </div>`;
        } else {
            operatorHtml = `<span class="text-[11px] text-gray-400 shrink-0 px-1">${cfg.operators[0]}</span>`;
        }

        let valueHtml;
        if (cond.attr === 'Inventory') {
            valueHtml = cond.operator === 'is'
                ? `<select class="cond-value border border-gray-300 rounded-md px-2 py-1.5 text-xs bg-white flex-1 min-w-0" data-group="${groupId}" data-cond="${cond.id}">
                        <option value="">Select value</option>
                        <option value="In stock" ${cond.value === 'In stock' ? 'selected' : ''}>In stock</option>
                        <option value="Out of stock" ${cond.value === 'Out of stock' ? 'selected' : ''}>Out of stock</option>
                   </select>`
                : `<input type="number" class="cond-value border border-gray-300 rounded-md px-2 py-1.5 text-xs flex-1 min-w-0" placeholder="Quantity" value="${cond.value || ''}" data-group="${groupId}" data-cond="${cond.id}">`;
        } else if (cond.attr === 'Price') {
            valueHtml = `<div class="relative flex-1 min-w-0">
                <span class="absolute left-2 top-1/2 -translate-y-1/2 text-xs text-gray-400">$</span>
                <input type="number" step="0.01" class="cond-value border border-gray-300 rounded-md pl-5 pr-2 py-1.5 text-xs w-full" placeholder="0.00" value="${cond.value || ''}" data-group="${groupId}" data-cond="${cond.id}">
            </div>`;
        } else if (cond.attr === 'Date published') {
            valueHtml = `<input type="date" class="cond-value border border-gray-300 rounded-md px-2 py-1.5 text-xs flex-1 min-w-0" value="${cond.value || ''}" data-group="${groupId}" data-cond="${cond.id}">`;
        } else if (cfg.options) {
            valueHtml = `<select class="cond-value border border-gray-300 rounded-md px-2 py-1.5 text-xs bg-white flex-1 min-w-0" data-group="${groupId}" data-cond="${cond.id}">
                <option value="">Select value</option>
                ${cfg.options.map(o => `<option value="${o}" ${cond.value === o ? 'selected' : ''}>${o}</option>`).join('')}
            </select>`;
        } else {
            valueHtml = `<input type="text" class="cond-value border border-gray-300 rounded-md px-2 py-1.5 text-xs flex-1 min-w-0" placeholder="Enter product title" value="${cond.value || ''}" data-group="${groupId}" data-cond="${cond.id}">`;
        }
        return operatorHtml + valueHtml;
    }

    function renderConditionRow(groupId, cond, condCount) {
        const attrKeys = Object.keys(getAttrConfig(mode, ctx.getScopedProducts()));
        return `
        <div class="flex items-center gap-2">
            <select class="attr-select border border-gray-300 rounded-md px-2 py-1.5 text-xs bg-white w-32 shrink-0" data-group="${groupId}" data-cond="${cond.id}">
                ${attrKeys.map(a => `<option value="${a}" ${cond.attr === a ? 'selected' : ''}>${a}</option>`).join('')}
            </select>
            ${renderConditionValueControl(groupId, cond)}
            <button class="remove-cond-btn text-gray-400 hover:text-red-600 shrink-0 ${condCount <= 1 ? 'invisible' : ''}" data-group="${groupId}" data-cond="${cond.id}"><i class="fas fa-times text-xs"></i></button>
        </div>`;
    }

    function renderConditionGroups() {
        const wrap = $('condition-groups');
        let html = '';

        if (state.groups.length > 1) {
            html += `
            <div class="flex items-center gap-4 text-xs text-gray-600 bg-white border border-gray-200 rounded-md px-3 py-2">
                <span class="font-medium text-gray-700">Match groups using</span>
                <label class="flex items-center gap-1.5 cursor-pointer"><input type="radio" name="group-relation-${sfx}" value="AND" ${state.groupRelation === 'AND' ? 'checked' : ''} class="w-3.5 h-3.5 text-zinc-800 focus:ring-zinc-800"><span class="ml-1">AND</span></label>
                <label class="flex items-center gap-1.5 cursor-pointer"><input type="radio" name="group-relation-${sfx}" value="OR" ${state.groupRelation === 'OR' ? 'checked' : ''} class="w-3.5 h-3.5 text-zinc-800 focus:ring-zinc-800"><span class="ml-1">OR</span></label>
            </div>
            <p class="text-[11px] text-gray-400"><i class="fas fa-sort mr-1"></i>Drag to reorder — higher groups are prioritized first.</p>`;
        }

        html += state.groups.map((g, gi) => `
            <div class="cond-group p-3 space-y-2" draggable="true" data-group-id="${g.id}">
                <div class="flex items-center gap-2">
                    <span class="group-drag-handle text-gray-300 shrink-0"><i class="fas fa-grip-vertical text-xs"></i></span>
                    <span class="w-5 h-5 rounded-full bg-white border border-gray-200 text-gray-500 text-[10px] font-bold flex items-center justify-center shrink-0">${gi + 1}</span>
                    <input type="text" class="group-name-input flex-1 min-w-0 text-xs font-semibold text-gray-700 bg-transparent border-b border-dashed border-gray-300 focus:border-gray-500 outline-none px-0.5 py-0.5" data-group="${g.id}" value="${escapeAttr(g.name)}" maxlength="40" placeholder="Group name">
                    ${state.groups.length > 1 ? `<button class="remove-group-btn text-gray-400 hover:text-red-600 shrink-0" data-group="${g.id}"><i class="fas fa-trash-alt text-xs"></i></button>` : ''}
                </div>
                <p class="group-name-error hidden text-[10px] text-red-600 pl-7" data-group="${g.id}">Already used by another group.</p>
                <div class="space-y-2 pl-7">
                    ${g.conditions.map(cond => renderConditionRow(g.id, cond, g.conditions.length)).join('')}
                </div>
                ${g.conditions.length < MAX_CONDITIONS_PER_GROUP ? `<button class="add-cond-btn text-xs text-blue-600 font-medium hover:underline pl-7" data-group="${g.id}"><i class="fas fa-plus mr-1"></i>And attribute</button>` : ''}
            </div>
        `).join('');

        html += `<button type="button" class="add-group-btn text-xs text-blue-600 font-medium hover:underline block"><i class="fas fa-plus mr-1"></i>Add new group</button>`;

        wrap.innerHTML = html;
        bindConditionEvents();
        bindGroupDragReorder();
    }

    function nameIsDuplicate(groupId) {
        const g = state.groups.find(x => x.id == groupId);
        if (!g) return false;
        const name = g.name.trim().toLowerCase();
        if (!name) return true;
        return state.groups.some(o => o.id !== g.id && o.name.trim().toLowerCase() === name);
    }

    function refreshGroupNameValidation() {
        const wrap = $('condition-groups');
        state.groups.forEach(g => {
            const dup = nameIsDuplicate(g.id);
            const inp = wrap.querySelector(`.group-name-input[data-group="${g.id}"]`);
            const err = wrap.querySelector(`.group-name-error[data-group="${g.id}"]`);
            if (inp) inp.classList.toggle('name-duplicate', dup);
            if (err) err.classList.toggle('hidden', !dup);
        });
    }

    function groupNamesValid() {
        const names = state.groups.map(g => g.name.trim().toLowerCase());
        if (names.some(n => !n)) return false;
        return new Set(names).size === names.length;
    }

    function bindGroupDragReorder() {
        const wrap = $('condition-groups');
        let dragEl = null;
        wrap.querySelectorAll('.cond-group').forEach(row => {
            row.addEventListener('dragstart', e => {
                if (e.target.closest('input, select, textarea, button')) { e.preventDefault(); return; }
                dragEl = row; row.classList.add('dragging');
            });
            row.addEventListener('dragend', () => row.classList.remove('dragging'));
            row.addEventListener('dragover', e => {
                e.preventDefault();
                if (!dragEl || dragEl === row) return;
                const rect = row.getBoundingClientRect();
                const after = (e.clientY - rect.top) > rect.height / 2;
                row.parentNode.insertBefore(dragEl, after ? row.nextSibling : row);
            });
            row.addEventListener('drop', () => {
                const order = [...wrap.querySelectorAll('.cond-group')].map(r => r.dataset.groupId);
                state.groups.sort((a, b) => order.indexOf(String(a.id)) - order.indexOf(String(b.id)));
                renderConditionGroups();
                renderPreview();
            });
        });
    }

    function bindConditionEvents() {
        const wrap = $('condition-groups');

        wrap.querySelectorAll('.group-name-input').forEach(inp => inp.addEventListener('input', () => {
            state.groups.find(x => x.id == inp.dataset.group).name = inp.value;
            refreshGroupNameValidation();
        }));

        wrap.querySelector('.add-group-btn')?.addEventListener('click', () => {
            state.groups.push(newGroup(state.groups));
            renderConditionGroups();
            renderPreview();
        });

        wrap.querySelectorAll('.attr-select').forEach(sel => sel.addEventListener('change', () => {
            const g = state.groups.find(x => x.id == sel.dataset.group);
            const cond = g.conditions.find(x => x.id == sel.dataset.cond);
            cond.attr = sel.value;
            cond.operator = getAttrConfig(mode, ctx.getScopedProducts())[cond.attr].operators[0];
            cond.value = '';
            renderConditionGroups();
            renderPreview();
        }));

        wrap.querySelectorAll('.cond-operator').forEach(sel => sel.addEventListener('change', () => {
            const g = state.groups.find(x => x.id == sel.dataset.group);
            const cond = g.conditions.find(x => x.id == sel.dataset.cond);
            cond.operator = sel.value;
            cond.value = '';
            renderConditionGroups();
            renderPreview();
        }));

        wrap.querySelectorAll('.cond-value').forEach(el => {
            const update = () => {
                const g = state.groups.find(x => x.id == el.dataset.group);
                g.conditions.find(x => x.id == el.dataset.cond).value = el.value;
                renderPreview();
            };
            el.addEventListener('input', update);
            el.addEventListener('change', update);
        });

        wrap.querySelectorAll('.remove-cond-btn').forEach(btn => btn.addEventListener('click', () => {
            const g = state.groups.find(x => x.id == btn.dataset.group);
            if (g.conditions.length <= 1) return;
            g.conditions = g.conditions.filter(cond => cond.id != btn.dataset.cond);
            renderConditionGroups();
            renderPreview();
        }));

        wrap.querySelectorAll('.add-cond-btn').forEach(btn => btn.addEventListener('click', () => {
            state.groups.find(x => x.id == btn.dataset.group).conditions.push(newCondition());
            renderConditionGroups();
            renderPreview();
        }));

        wrap.querySelectorAll('.remove-group-btn').forEach(btn => btn.addEventListener('click', () => {
            if (state.groups.length <= 1) return;
            state.groups = state.groups.filter(g => g.id != btn.dataset.group);
            renderConditionGroups();
            renderPreview();
        }));

        wrap.querySelectorAll(`input[name="group-relation-${sfx}"]`).forEach(r => r.addEventListener('change', () => {
            state.groupRelation = r.value;
            renderPreview();
        }));
    }

    function attributesComplete() {
        return state.groups.every(g => g.conditions.every(cond => String(cond.value ?? '').trim() !== ''));
    }

    // ---------- preview ----------
    function renderPreview() {
        const t = TYPE_META[type];
        const contextText = ctx.getApplyContextText();

        let productText;
        if (state.productMode === 'specific') {
            const n = selectedProducts.size;
            productText = `<strong>${n}</strong> selected product${n === 1 ? '' : 's'}`;
        } else {
            const n = state.groups.length;
            const rel = n > 1 ? ` (matched ${state.groupRelation === 'AND' ? 'across all' : 'in any'} group${n === 1 ? '' : 's'})` : '';
            productText = `products matching <strong>${n}</strong> attribute condition group${n === 1 ? '' : 's'}${rel}`;
        }

        const verb = `${t.label.toLowerCase()}${type === 'hide' ? 'n' : 'ed'}`;
        const sentence = mode === 'search'
            ? `When a shopper searches with ${contextText}, ${productText} will be <strong>${verb}</strong>.`
            : `On <strong>${contextText}</strong>, ${productText} will be <strong>${verb}</strong>.`;

        $('preview-summary').innerHTML = `<i class="fas fa-info-circle mr-1 text-gray-400"></i> ${sentence}`;
    }

    // ---------- public API ----------
    return {
        get enabled() { return state.enabled; },

        load(rule) {
            state = {
                ...blankRule(),
                ...rule,
                groups: rule.groups && rule.groups.length ? JSON.parse(JSON.stringify(rule.groups)) : [newGroup()]
            };
            selectedProducts = new Set(rule.productMode === 'attributes' ? [] : (rule.productIds || []));
            productQuery = '';
            $('product-search').value = '';

            ['products-error', 'attributes-error', 'group-names-error'].forEach(id => $(id).classList.add('hidden'));

            setEnabled(state.enabled);
            setProductMode(state.productMode);
            this.refreshScope();
        },

        // called whenever the project-level "where/how it applies" config changes
        refreshScope() {
            const scoped = ctx.getScopedProducts();
            const ids = new Set(scoped.map(p => p.id));
            [...selectedProducts].forEach(id => { if (!ids.has(id)) selectedProducts.delete(id); });
            const cfg = getAttrConfig(mode, scoped);
            state.groups.forEach(g => g.conditions.forEach(cond => {
                const conf = cfg[cond.attr];
                if (conf.options && cond.value && !conf.options.includes(cond.value)) cond.value = '';
            }));
            const note = $('scope-note');
            if (note) note.textContent = ctx.getScopeNoteText();
            renderProductList();
            renderSelectedChips();
            renderConditionGroups();
            renderPreview();
        },

        validate() {
            if (!state.enabled) return true;
            let ok = true;
            if (state.productMode === 'specific') {
                if (selectedProducts.size === 0) { $('products-error').classList.remove('hidden'); ok = false; }
                else $('products-error').classList.add('hidden');
            } else {
                if (!groupNamesValid()) { $('group-names-error').classList.remove('hidden'); refreshGroupNameValidation(); ok = false; }
                else $('group-names-error').classList.add('hidden');
                if (!attributesComplete()) { $('attributes-error').classList.remove('hidden'); ok = false; }
                else $('attributes-error').classList.add('hidden');
            }
            return ok;
        },

        collect() {
            return {
                enabled: state.enabled,
                productMode: state.productMode,
                productIds: state.productMode === 'specific' ? [...selectedProducts] : [],
                groups: state.productMode === 'attributes' ? JSON.parse(JSON.stringify(state.groups)) : [],
                groupRelation: state.groupRelation
            };
        }
    };
}

// ==================== APP ENGINE (one per mode) ====================
function initApp(mode) {
    const c = MODE_CONFIG[mode];
    const $ = name => document.getElementById(`${name}-${mode}`);

    let projects = loadProjects(c.storageKey, c.seed);
    let nextId = Math.max(0, ...projects.map(p => p.id)) + 1;
    let editingId = null;
    let applyConfig = blankApplyConfig();

    const listScreen = $('list-screen');
    const builderScreen = $('builder-screen');
    const tbody = $('projects-tbody');
    const emptyState = $('projects-empty');
    const tableCard = $('projects-table-card');
    const listHeader = $('list-header');

    // ---------- shared "where/how it applies" (used by every rule type) ----------
    function getScopedProducts() {
        if (mode !== 'collection') return PRODUCTS;
        if (applyConfig.applyMode === 'specific') {
            if (!applyConfig.collection) return [];
            return PRODUCTS.filter(p => p.collections.includes(applyConfig.collection));
        }
        return PRODUCTS;
    }

    function getScopeNoteText() {
        if (mode !== 'collection') return '';
        if (applyConfig.applyMode === 'specific' && !applyConfig.collection) return 'Select a collection on the left to browse its products.';
        if (applyConfig.applyMode === 'specific') return `Showing products from "${applyConfig.collection}" only.`;
        return 'Showing every product in your store.';
    }

    function getApplyContextText() {
        if (mode === 'search') {
            if (applyConfig.applyMode === 'specific') {
                const mm = applyConfig.matchMode === 'is' ? 'is exactly' : 'contains';
                return applyConfig.terms.length
                    ? `a search term that ${mm} ${applyConfig.terms.map(x => '"' + x + '"').join(', ')}`
                    : '(no terms added yet)';
            }
            return 'any search term';
        }
        return applyConfig.applyMode === 'specific' ? (applyConfig.collection || '(no collection selected)') : 'all collection pages';
    }

    const editors = {};
    TYPES.forEach(t => {
        editors[t] = initRuleEditor(mode, t, {
            onEnabledChange: () => { refreshTabDots(); validateHasRule(false); },
            getScopedProducts,
            getScopeNoteText,
            getApplyContextText
        });
    });

    function onApplyConfigChange() {
        TYPES.forEach(t => editors[t].refreshScope());
    }

    function syncApplySegUI() {
        document.querySelectorAll(`input[name="apply-mode-${mode}"]`).forEach(r => {
            const label = r.closest('.seg-btn');
            label.classList.toggle('active', r.checked);
            label.classList.toggle('text-gray-900', r.checked);
            label.classList.toggle('text-gray-500', !r.checked);
        });
    }

    function refreshApplyVisibility() {
        $('specific-box').classList.toggle('hidden', applyConfig.applyMode !== 'specific');
        if (mode === 'search') $('all-terms-note').classList.toggle('hidden', applyConfig.applyMode !== 'all');
    }

    document.querySelectorAll(`input[name="apply-mode-${mode}"]`).forEach(r => r.addEventListener('change', () => {
        applyConfig.applyMode = r.value;
        syncApplySegUI();
        refreshApplyVisibility();
        onApplyConfigChange();
    }));

    if (mode === 'collection') {
        $('collection-select').addEventListener('change', e => {
            applyConfig.collection = e.target.value;
            onApplyConfigChange();
        });
    }

    if (mode === 'search') {
        $('match-mode').addEventListener('change', e => { applyConfig.matchMode = e.target.value; onApplyConfigChange(); });

        const addTerm = () => {
            const input = $('term-input');
            const raw = input.value;
            if (!raw.trim()) return;
            const parts = raw.split(',').map(s => s.trim()).filter(Boolean);
            let skipped = false;
            parts.forEach(p => {
                if (applyConfig.terms.some(t => t.toLowerCase() === p.toLowerCase())) skipped = true;
                else applyConfig.terms.push(p);
            });
            input.value = '';
            $('terms-duplicate-warning').classList.toggle('hidden', !skipped);
            if (parts.length) $('terms-error').classList.add('hidden');
            renderTermChips();
            onApplyConfigChange();
        };
        $('term-add-btn').addEventListener('click', addTerm);
        $('term-input').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addTerm(); } });
    }

    function renderTermChips() {
        if (mode !== 'search') return;
        const list = $('terms-chip-list');
        list.innerHTML = applyConfig.terms.map(t => `
            <span class="chip">${t}<button data-term="${escapeAttr(t)}" class="remove-term-btn"><i class="fas fa-times text-[9px]"></i></button></span>
        `).join('');
        list.querySelectorAll('.remove-term-btn').forEach(btn => btn.addEventListener('click', () => {
            applyConfig.terms = applyConfig.terms.filter(t => t !== btn.dataset.term);
            renderTermChips();
            onApplyConfigChange();
        }));
    }

    function validateApplyConfig() {
        let ok = true;
        if (mode === 'search') {
            if (applyConfig.applyMode === 'specific' && applyConfig.terms.length === 0) {
                $('terms-error').classList.remove('hidden'); ok = false;
            } else $('terms-error').classList.add('hidden');
        }
        if (mode === 'collection') {
            if (applyConfig.applyMode === 'specific' && !applyConfig.collection) {
                $('collection-error').classList.remove('hidden'); ok = false;
            } else $('collection-error').classList.add('hidden');
        }
        return ok;
    }

    function fmtDate(d) {
        if (!d) return null;
        return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
    }
    function isExpired(p) { return p.end && new Date(p.end + 'T00:00:00') < TODAY; }
    function checkExpiry(p) {
        if (!p._expiredApplied && isExpired(p)) { p.enabled = false; p._expiredApplied = true; }
    }

    // ---------- projects table ----------
    function renderTable() {
        projects.forEach(checkExpiry);
        saveProjects(c.storageKey, projects);

        if (projects.length === 0) {
            listHeader.classList.add('hidden'); listHeader.classList.remove('flex');
            emptyState.classList.remove('hidden');
            tableCard.classList.add('hidden');
            return;
        }
        listHeader.classList.remove('hidden'); listHeader.classList.add('flex');
        emptyState.classList.add('hidden');
        tableCard.classList.remove('hidden');

        tbody.innerHTML = projects.map(p => {
            const expired = isExpired(p);
            const order = (Array.isArray(p.ruleOrder) && p.ruleOrder.length ? p.ruleOrder : TYPES).filter(t => TYPES.includes(t));
            TYPES.forEach(t => { if (!order.includes(t)) order.push(t); });
            const activeTypes = order.filter(t => p.rules[t] && p.rules[t].enabled);
            const ruleBadges = activeTypes.length
                ? activeTypes.map((t, i) => `<span class="badge ${TYPE_META[t].badge}">${i + 1} · ${TYPE_META[t].label}</span>`).join(' ')
                : '<span class="text-[11px] text-gray-400">No rules set</span>';
            return `
            <tr draggable="true" data-id="${p.id}" class="rule-row border-b border-gray-100 last:border-0 hover:bg-gray-50">
                <td class="px-3 py-3 text-gray-300 drag-handle"><i class="fas fa-grip-vertical"></i></td>
                <td class="px-3 py-3">
                    <button data-id="${p.id}" class="toggle-btn relative inline-flex h-5 w-9 flex-shrink-0 rounded-full border-2 border-transparent toggle-track ${p.enabled ? 'bg-emerald-500' : 'bg-gray-200'}">
                        <span class="pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow ring-0 toggle-knob ${p.enabled ? 'translate-x-4' : 'translate-x-0'}"></span>
                    </button>
                </td>
                <td class="px-3 py-3 text-sm font-medium text-gray-800">${p.name}</td>
                <td class="px-3 py-3"><div class="flex flex-wrap gap-1">${ruleBadges}</div></td>
                <td class="px-3 py-3 text-xs text-gray-600">${fmtDate(p.start) || '—'}</td>
                <td class="px-3 py-3 text-xs text-gray-600">${fmtDate(p.end) || '—'}${expired ? ' <span class="text-red-500 font-medium">(Expired)</span>' : ''}</td>
                <td class="px-3 py-3 text-right whitespace-nowrap">
                    <button data-id="${p.id}" class="edit-btn text-gray-400 hover:text-gray-700 mr-3"><i class="fas fa-pen text-xs"></i></button>
                    <button data-id="${p.id}" class="delete-btn text-gray-400 hover:text-red-600"><i class="fas fa-trash-alt text-xs"></i></button>
                </td>
            </tr>`;
        }).join('');

        tbody.querySelectorAll('.toggle-btn').forEach(btn => btn.addEventListener('click', () => {
            const p = projects.find(x => x.id == btn.dataset.id);
            p.enabled = !p.enabled;
            if (p.enabled) p._expiredApplied = false;
            renderTable();
        }));
        tbody.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', () => openBuilder(btn.dataset.id)));
        tbody.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', () => {
            if (confirm('Delete this project?')) { projects = projects.filter(x => x.id != btn.dataset.id); renderTable(); }
        }));

        bindDragReorder();
    }

    function bindDragReorder() {
        let dragEl = null;
        tbody.querySelectorAll('.rule-row').forEach(row => {
            row.addEventListener('dragstart', e => {
                if (e.target.closest('button')) { e.preventDefault(); return; }
                dragEl = row; row.classList.add('dragging');
            });
            row.addEventListener('dragend', () => row.classList.remove('dragging'));
            row.addEventListener('dragover', e => {
                e.preventDefault();
                if (!dragEl || dragEl === row) return;
                const rect = row.getBoundingClientRect();
                const after = (e.clientY - rect.top) > rect.height / 2;
                row.parentNode.insertBefore(dragEl, after ? row.nextSibling : row);
            });
            row.addEventListener('drop', () => {
                const order = [...tbody.querySelectorAll('.rule-row')].map(r => r.dataset.id);
                projects.sort((a, b) => order.indexOf(String(a.id)) - order.indexOf(String(b.id)));
                renderTable();
            });
        });
    }

    // ---------- rule priority pills + type panels ----------
    // ruleOrder is the left→right priority the storefront applies rules in.
    let ruleOrder = TYPES.slice();
    let activeType = TYPES[0];
    const pillsWrap = $('rule-pills');

    function normalizeOrder(arr) {
        const base = Array.isArray(arr) ? arr.filter(t => TYPES.includes(t)) : [];
        TYPES.forEach(t => { if (!base.includes(t)) base.push(t); });
        return base;
    }

    function setActiveType(t) {
        activeType = t;
        TYPES.forEach(x => {
            document.getElementById(`type-panel-${mode}-${x}`).classList.toggle('hidden', x !== t);
        });
        renderRulePills();
    }

    function renderPriorityHint() {
        const seq = ruleOrder
            .map((t, i) => `<span class="font-semibold text-gray-600">${i + 1} ${TYPE_META[t].label}</span>`)
            .join(' <span class="text-gray-300">→</span> ');
        $('rule-priority-hint').innerHTML =
            `<i class="fas fa-list-ol mr-1 text-gray-400"></i>When the storefront runs this project it applies rules left to right: ${seq}.`;
    }

    function renderRulePills() {
        pillsWrap.innerHTML = ruleOrder.map((t, i) => {
            const on = editors[t].enabled;
            return `
            <div class="rule-pill ${t === activeType ? 'active-' + t : ''}" draggable="true" data-type="${t}">
                <span class="rule-pill-handle"><i class="fas fa-grip-vertical"></i></span>
                <span class="rule-pill-order">${i + 1}</span>
                <span class="rule-pill-name">${TYPE_META[t].label}</span>
                <span class="rule-pill-status badge ${on ? TYPE_META[t].badge : 'badge-off'}">${on ? 'On' : 'Off'}</span>
            </div>`;
        }).join('');

        pillsWrap.querySelectorAll('.rule-pill').forEach(pill => {
            pill.addEventListener('click', () => setActiveType(pill.dataset.type));
        });
        bindPillDragReorder();
        renderPriorityHint();
    }

    function bindPillDragReorder() {
        let dragEl = null;
        pillsWrap.querySelectorAll('.rule-pill').forEach(pill => {
            pill.addEventListener('dragstart', e => {
                dragEl = pill;
                pill.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
            });
            pill.addEventListener('dragend', () => {
                pill.classList.remove('dragging');
                pillsWrap.querySelectorAll('.rule-pill').forEach(p => p.classList.remove('drop-target'));
            });
            pill.addEventListener('dragover', e => {
                e.preventDefault();
                if (!dragEl || dragEl === pill) return;
                const rect = pill.getBoundingClientRect();
                const after = (e.clientX - rect.left) > rect.width / 2;
                pillsWrap.insertBefore(dragEl, after ? pill.nextSibling : pill);
            });
            pill.addEventListener('drop', e => {
                e.preventDefault();
                ruleOrder = [...pillsWrap.querySelectorAll('.rule-pill')].map(p => p.dataset.type);
                renderRulePills();
            });
        });
    }

    // kept name for existing callers — now redraws the priority pills
    function refreshTabDots() { renderRulePills(); }

    function validateHasRule(show) {
        const any = TYPES.some(t => editors[t].enabled);
        if (show) $('no-rule-error').classList.toggle('hidden', any);
        else if (any) $('no-rule-error').classList.add('hidden');
        return any;
    }

    // ---------- builder open/close ----------
    $('add-project-btn').addEventListener('click', () => openBuilder(null));
    document.querySelectorAll('.add-project-trigger-' + mode).forEach(b => b.addEventListener('click', () => openBuilder(null)));
    $('builder-back-btn').addEventListener('click', closeBuilder);
    $('builder-cancel-btn').addEventListener('click', closeBuilder);

    function openBuilder(id) {
        editingId = id;
        const existing = id ? projects.find(p => p.id == id) : null;

        $('builder-title').textContent = existing ? 'EDIT PROJECT' : 'ADD A NEW PROJECT';
        $('project-name').value = existing ? existing.name : '';
        $('start-date').value = existing ? existing.start : '';
        $('end-date').value = existing ? existing.end : '';
        $('market-select').value = existing ? existing.market : 'Store default';
        $('project-name-error').classList.add('hidden');
        $('no-rule-error').classList.add('hidden');

        applyConfig = existing && existing.applyConfig ? { ...blankApplyConfig(), ...existing.applyConfig, terms: [...(existing.applyConfig.terms || [])] } : blankApplyConfig();
        document.querySelectorAll(`input[name="apply-mode-${mode}"]`).forEach(r => { r.checked = r.value === applyConfig.applyMode; });
        if (mode === 'search') $('match-mode').value = applyConfig.matchMode;
        if (mode === 'collection') $('collection-select').value = applyConfig.collection;
        if (mode === 'search') { $('terms-error').classList.add('hidden'); $('terms-duplicate-warning').classList.add('hidden'); }
        if (mode === 'collection') $('collection-error').classList.add('hidden');
        syncApplySegUI();
        refreshApplyVisibility();
        renderTermChips();

        ruleOrder = normalizeOrder(existing ? existing.ruleOrder : null);
        TYPES.forEach(t => editors[t].load(existing ? (existing.rules[t] || blankRule()) : blankRule()));
        setActiveType('boost');

        listScreen.classList.add('hidden');
        builderScreen.classList.remove('hidden');
    }

    function closeBuilder() {
        builderScreen.classList.add('hidden');
        listScreen.classList.remove('hidden');
    }

    // ---------- save ----------
    $('builder-save-btn').addEventListener('click', () => {
        const name = $('project-name').value.trim();
        let valid = true;

        $('project-name-error').classList.toggle('hidden', !!name);
        if (!name) valid = false;

        if (!validateApplyConfig()) valid = false;
        if (!validateHasRule(true)) valid = false;

        let firstBroken = null;
        TYPES.forEach(t => {
            if (!editors[t].validate()) {
                valid = false;
                if (!firstBroken) firstBroken = t;
            }
        });
        if (firstBroken) setActiveType(firstBroken);

        if (!valid) return;

        const payload = {
            name,
            start: $('start-date').value,
            end: $('end-date').value,
            market: $('market-select').value,
            applyConfig: { ...applyConfig, terms: [...applyConfig.terms] },
            ruleOrder: [...ruleOrder],
            rules: TYPES.reduce((acc, t) => { acc[t] = editors[t].collect(); return acc; }, {}),
            _expiredApplied: false
        };

        if (editingId) {
            const idx = projects.findIndex(p => p.id == editingId);
            projects[idx] = { ...projects[idx], ...payload };
        } else {
            projects.push({ id: nextId++, enabled: true, ...payload });
        }

        closeBuilder();
        renderTable();
    });

    renderTable();
}

// ==================== PAGE TABS ====================
document.getElementById('app-search').innerHTML = pageTemplate('search');
document.getElementById('app-collection').innerHTML = pageTemplate('collection');
initApp('search');
initApp('collection');

const pageTabBtns = document.querySelectorAll('.page-tab-btn');
function setPageTab(page) {
    pageTabBtns.forEach(b => {
        const active = b.dataset.page === page;
        b.classList.toggle('active', active);
        b.classList.toggle('text-gray-900', active);
        b.classList.toggle('text-gray-500', !active);
    });
    document.querySelectorAll('.page-panel').forEach(p => p.classList.add('hidden'));
    document.getElementById('app-' + page).classList.remove('hidden');
}
pageTabBtns.forEach(b => b.addEventListener('click', () => setPageTab(b.dataset.page)));
setPageTab('collection');
</script>

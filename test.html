    .rule-row td { vertical-align: middle; }
    .drag-handle { cursor: grab; }

function uniqueValues(list, field) {
    const set = new Set();
    list.forEach(p => {
        const v = p[field];
        if (Array.isArray(v)) v.forEach(x => set.add(x)); else if (v) set.add(v);
    });
    return [...set].sort();
}
const METAFIELDS = ['Material: Cotton','Material: Leather','Warranty: 1 Year','Warranty: 2 Years'];

function getAttrConfig(mode, scopedProducts) {
    const cfg = {
        'Product title':    { operators:['is'] },
        'Product Type':     { operators:['is'], options: uniqueValues(scopedProducts, 'type') },
        'Product Category': { operators:['is'], options: uniqueValues(scopedProducts, 'category') },
        'Vendor':            { operators:['is'], options: uniqueValues(scopedProducts, 'vendor') },
        'Product Tag':       { operators:['is'], options: uniqueValues(scopedProducts, 'tags') },
        'Metafield':         { operators:['is'], options: METAFIELDS },
        'Inventory':         { operators:['is','<=','=','>='] },
        'Price':             { operators:['=','<=','>='] },
        'Date published':    { operators:['Before','After'] }
    };
    if (mode === 'search') cfg['Collection'] = { operators:['is'], options: COLLECTIONS };
    return cfg;
}

function escapeAttr(str) {
    return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
}

let condIdSeq = 1;
function newCondition() {
    return { id: condIdSeq++, attr:'Product title', operator:'is', value:'' };
}
function newGroup(existingGroups) {
    const list = existingGroups || [];
    const existingNames = new Set(list.map(g => g.name.trim().toLowerCase()));
    let n = list.length + 1;
    while (existingNames.has(`condition group ${n}`.toLowerCase())) n++;
    return { id: condIdSeq++, name: `Condition Group ${n}`, conditions: [newCondition()] };
}

function loadRules(key, seed) {
    try {
        const raw = localStorage.getItem(key);
        if (raw) return JSON.parse(raw);
    } catch (e) {}
    try { localStorage.setItem(key, JSON.stringify(seed)); } catch (e) {}
    return seed;
}
function saveRules(key, list) {
    try { localStorage.setItem(key, JSON.stringify(list)); } catch (e) {}
}

            <div class="flex gap-2">
                <input id="term-input-${mode}" type="text" placeholder="Type terms, comma-separated, then Enter" class="flex-1 border border-gray-300 rounded-md py-1.5 px-2.5 text-xs focus:outline-none focus:ring-1 focus:ring-blue-500">
                <button id="term-add-btn-${mode}" type="button" class="px-3 py-1.5 border border-gray-300 rounded-md text-xs font-medium bg-white hover:bg-gray-50">Add</button>
            </div>
            <p id="terms-error-${mode}" class="hidden text-[11px] text-red-600">Add at least one search term.</p>
            <p id="terms-duplicate-warning-${mode}" class="hidden text-[11px] text-amber-600">Some terms already existed and were skipped.</p>
        </div>` : `
        <div class="seg mb-3">
            <label class="seg-btn px-3 py-1.5 text-xs font-semibold text-gray-500 cursor-pointer">
                <input type="radio" name="apply-mode-${mode}" value="all" checked class="hidden apply-mode-radio"><span>All Collections</span>
            </label>
            <label class="seg-btn px-3 py-1.5 text-xs font-semibold text-gray-500 cursor-pointer">
                <input type="radio" name="apply-mode-${mode}" value="specific" class="hidden apply-mode-radio"><span>One Collection</span>
            </label>
        </div>
        <div id="specific-box-${mode}" class="hidden space-y-2">
            <div class="relative">
                <select id="collection-select-${mode}" class="w-full border border-gray-300 rounded-md py-2 px-3 text-sm appearance-none bg-white focus:outline-none focus:ring-1 focus:ring-blue-500">
                    <option value="">Select a collection</option>
                    ${COLLECTIONS.map(cn => `<option value="${cn}">${cn}</option>`).join('')}
                </select>
                <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400"><i class="fas fa-chevron-down text-xs"></i></div>
            </div>
            <p id="collection-error-${mode}" class="hidden text-[11px] text-red-600">Please select a collection.</p>
        </div>`;

    return `
    <div class="bg-white border border-gray-200 rounded-xl custom-shadow overflow-hidden">
        <div class="px-5 py-3.5 border-b border-gray-200 flex items-center justify-between">
            <button id="builder-back-btn-${mode}" class="text-sm text-gray-600 hover:text-gray-900 flex items-center gap-2">
                <i class="fas fa-arrow-left"></i>Back
            </button>
            <div id="builder-title-${mode}" class="text-sm font-bold tracking-wide text-gray-800">ADD A NEW RULE</div>
            <div class="flex items-center gap-2">
                <button id="builder-cancel-btn-${mode}" class="px-4 py-1.5 border border-gray-300 rounded text-xs font-medium text-gray-700 bg-white hover:bg-gray-50">Cancel</button>
                <button id="builder-save-btn-${mode}" class="px-4 py-1.5 bg-zinc-800 rounded text-xs font-semibold text-white hover:bg-zinc-700 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-zinc-800" disabled>Save Rule</button>
            </div>
        </div>

    <div class="p-6 max-w-2xl mx-auto space-y-5">
        <!-- STEP 1: Type & name -->
        <div id="step-1-${mode}" class="step-panel space-y-4">
            <div class="flex items-center gap-2">
                <span class="w-5 h-5 rounded-full bg-zinc-800 text-white text-[10px] font-bold flex items-center justify-center shrink-0">1</span>
                <span class="text-xs font-bold text-gray-700 uppercase tracking-wide">What should happen</span>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-2">Choose a type <span class="text-red-500">*</span></label>
                <div class="grid grid-cols-3 gap-2">
                    <button type="button" data-type="boost" class="type-card type-card-${mode} border-2 border-gray-200 rounded-lg py-3 text-center">
                        <i class="fas fa-arrow-up text-blue-600 block mb-1"></i>
                        <span class="text-xs font-semibold text-gray-700">Boost</span>
                    </button>
                    <button type="button" data-type="demote" class="type-card type-card-${mode} border-2 border-gray-200 rounded-lg py-3 text-center">
                        <i class="fas fa-arrow-down text-amber-600 block mb-1"></i>
                        <span class="text-xs font-semibold text-gray-700">Demote</span>
                    </button>
                    <button type="button" data-type="hide" class="type-card type-card-${mode} border-2 border-gray-200 rounded-lg py-3 text-center">
                        <i class="fas fa-eye-slash text-red-600 block mb-1"></i>
                        <span class="text-xs font-semibold text-gray-700">Hide</span>
                    </button>
                </div>
                <p id="type-desc-${mode}" class="text-[11px] text-gray-400 mt-1.5"></p>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1.5">Rule name <span class="text-red-500">*</span></label>
                <input id="rule-name-${mode}" type="text" maxlength="60" placeholder="${c.ruleNamePlaceholder}" class="w-full border border-gray-300 rounded-md py-2 px-3 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
                <p id="rule-name-error-${mode}" class="hidden text-[11px] text-red-600 mt-1">Give this rule a name.</p>
            </div>

            <button type="button" class="step-continue-btn px-4 py-1.5 bg-zinc-800 rounded text-xs font-semibold text-white hover:bg-zinc-700" data-step="1">Continue</button>
        </div>

        <!-- STEP 2: Schedule -->
        <div id="step-2-${mode}" class="step-panel hidden space-y-4 border-t border-gray-100 pt-5">
            <div class="flex items-center gap-2">
                <span class="w-5 h-5 rounded-full bg-zinc-800 text-white text-[10px] font-bold flex items-center justify-center shrink-0">2</span>
                <span class="text-xs font-bold text-gray-700 uppercase tracking-wide">Schedule</span>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1.5">Active date</label>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] text-gray-500 mb-1">Start Date</label>
                        <input id="start-date-${mode}" type="date" class="w-full border border-gray-300 rounded-md py-2 px-3 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-[11px] text-gray-500 mb-1">End Date</label>
                        <input id="end-date-${mode}" type="date" class="w-full border border-gray-300 rounded-md py-2 px-3 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>
                </div>
                <p class="text-[11px] text-gray-400 mt-1.5">Leave blank to run forever.</p>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1.5">Market</label>
                <div class="relative">
                    <select id="market-select-${mode}" class="w-full border border-gray-300 rounded-md py-2 px-3 text-sm appearance-none bg-white focus:outline-none focus:ring-1 focus:ring-blue-500">
                        <option>Store default</option>
                        <option>United States</option>
                        <option>European Union</option>
                        <option>Asia Pacific</option>
                    </select>
                    <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400"><i class="fas fa-chevron-down text-xs"></i></div>
                </div>
            </div>

            <button type="button" class="step-continue-btn px-4 py-1.5 bg-zinc-800 rounded text-xs font-semibold text-white hover:bg-zinc-700" data-step="2">Continue</button>
        </div>

        <!-- STEP 3: Apply to -->
        <div id="step-3-${mode}" class="step-panel hidden border-t border-gray-100 pt-5">
            <div class="flex items-center gap-2 mb-3">
                <span class="w-5 h-5 rounded-full bg-zinc-800 text-white text-[10px] font-bold flex items-center justify-center shrink-0">3</span>
                <span class="text-xs font-bold text-gray-700 uppercase tracking-wide">Where it applies</span>
            </div>
            ${applyToBlock}
            <button type="button" class="step-continue-btn px-4 py-1.5 bg-zinc-800 rounded text-xs font-semibold text-white hover:bg-zinc-700" data-step="3">Continue</button>
        </div>

        <!-- STEP 4: Products -->
        <div id="step-4-${mode}" class="step-panel hidden border-t border-gray-100 pt-5">
            <div class="flex items-center gap-2 mb-3">
                <span class="w-5 h-5 rounded-full bg-zinc-800 text-white text-[10px] font-bold flex items-center justify-center shrink-0">4</span>
                <span class="text-xs font-bold text-gray-700 uppercase tracking-wide">Which products</span>
            </div>
            <label class="block text-xs font-semibold text-gray-700 mb-2">Choose products to apply <span class="text-red-500">*</span></label>

            <div class="seg mb-3">
                <label class="seg-btn px-3 py-1.5 text-xs font-semibold text-gray-500 cursor-pointer">
                    <input type="radio" name="product-mode-${mode}" value="specific" class="hidden product-mode-radio"><span>Pick products</span>
                </label>
                <label class="seg-btn px-3 py-1.5 text-xs font-semibold text-gray-500 cursor-pointer">
                    <input type="radio" name="product-mode-${mode}" value="attributes" class="hidden product-mode-radio"><span>By attributes</span>
                </label>
            </div>

            ${mode === 'collection' ? `<p id="scope-note-${mode}" class="text-[11px] text-gray-400 mb-2"></p>` : ''}

            <div id="specific-products-panel-${mode}">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-[11px] text-gray-400">Up to 6 products</span>
                    <span id="selected-count-${mode}" class="text-[11px] text-gray-400">0/6 selected</span>
                </div>
                <div id="selected-chips-${mode}" class="flex flex-wrap gap-1.5 mb-2 empty:hidden"></div>
                <div class="relative mb-2.5">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                    <input id="product-search-${mode}" type="text" placeholder="Search products..." class="w-full border border-gray-300 rounded-md py-2 pl-8 pr-3 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
                </div>
                <div id="product-list-${mode}" class="border border-gray-200 rounded-md bg-white max-h-64 overflow-y-auto divide-y divide-gray-100 shadow-inner"></div>
                <p id="products-error-${mode}" class="hidden text-[11px] text-red-600 mt-1.5">Select at least one product.</p>
            </div>

            <div id="attributes-panel-${mode}" class="hidden">
                <div id="condition-groups-${mode}" class="space-y-2.5"></div>
                <p id="group-names-error-${mode}" class="hidden text-[11px] text-red-600 mt-1.5">Give each condition group a unique name.</p>
                <p id="attributes-error-${mode}" class="hidden text-[11px] text-red-600 mt-1.5">Please complete all attribute conditions.</p>
            </div>

            <div class="mt-3 bg-gray-50 border border-gray-200 rounded-lg p-3 text-[11px] text-gray-500 leading-relaxed" id="preview-summary-${mode}"></div>
        </div>
    </div>
    </div>`;
}

// ==================== APP ENGINE (one instance per mode) ====================
function initApp(mode) {
    const c = MODE_CONFIG[mode];
    const $ = sel => document.getElementById(sel + '-' + mode);

    let rules = loadRules(c.storageKey, c.seed);
    let nextId = Math.max(0, ...rules.map(r => r.id)) + 1;
    let editingId = null;
    let builderState = { type:'boost', terms:[], selectedProducts:new Set(), productQuery:'', productMode:'specific', groups:[newGroup()], groupRelation:'AND', collection:'' };

    const listScreen = $('list-screen');
    const builderScreen = $('builder-screen');
    const rulesTbody = $('rules-tbody');
    const rulesEmpty = $('rules-empty');
    const rulesTableCard = $('rules-table-card');
    const boosterHeader = $('booster-header');

    function fmtDate(d) {
        if (!d) return null;
        const dt = new Date(d + 'T00:00:00');
        return dt.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
    }
    function isExpired(r) { return r.end && new Date(r.end + 'T00:00:00') < TODAY; }
    function checkExpiry(r) {
        if (!r._expiredApplied && isExpired(r)) { r.enabled = false; r._expiredApplied = true; }
    }

    function getScopedProducts() {
        if (mode !== 'collection') return PRODUCTS;
        const modeEl = document.querySelector(`input[name="apply-mode-${mode}"]:checked`);
        const am = modeEl ? modeEl.value : 'all';
        if (am === 'specific') {
            const col = $('collection-select').value;
            if (!col) return [];
            return PRODUCTS.filter(p => p.collections.includes(col));
        }
        return PRODUCTS;
    }

    // ---------- rules table ----------
    function renderRulesTable() {
        rules.forEach(checkExpiry);
        saveRules(c.storageKey, rules);

        if (rules.length === 0) {
            boosterHeader.classList.add('hidden'); boosterHeader.classList.remove('flex');
            rulesEmpty.classList.remove('hidden');
            rulesTableCard.classList.add('hidden');
            return;
        }
        boosterHeader.classList.remove('hidden'); boosterHeader.classList.add('flex');
        rulesEmpty.classList.add('hidden');
        rulesTableCard.classList.remove('hidden');

        rulesTbody.innerHTML = rules.map(r => {
            const meta = TYPE_META[r.type];
            const expired = isExpired(r);
            const subtitle = mode === 'search'
                ? (r.applyMode === 'all' ? 'All search terms' : (r.matchMode === 'contains' ? 'Contains: ' : 'Is: ') + (r.terms || []).join(', '))
                : '';
            return `
            <tr draggable="true" data-id="${r.id}" class="rule-row border-b border-gray-100 last:border-0 hover:bg-gray-50">
                <td class="px-3 py-3 text-gray-300 drag-handle"><i class="fas fa-grip-vertical"></i></td>
                <td class="px-3 py-3">
                    <button data-id="${r.id}" class="toggle-btn relative inline-flex h-5 w-9 flex-shrink-0 rounded-full border-2 border-transparent toggle-track ${r.enabled ? 'bg-emerald-500' : 'bg-gray-200'}">
                        <span class="pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow ring-0 toggle-knob ${r.enabled ? 'translate-x-4' : 'translate-x-0'}"></span>
                    </button>
                </td>
                <td class="px-3 py-3">
                    <div class="text-sm font-medium text-gray-800">${r.name}</div>
                    ${subtitle ? `<div class="text-[11px] text-gray-400">${subtitle}</div>` : ''}
                </td>
                <td class="px-3 py-3"><span class="badge ${meta.badge}">${meta.label}</span></td>
                ${c.hasCollectionColumn ? `<td class="px-3 py-3 text-xs text-gray-600">${r.applyMode === 'all' ? 'All Collections' : (r.collection || '—')}</td>` : ''}
                <td class="px-3 py-3 text-xs text-gray-600">${fmtDate(r.start) || '—'}</td>
                <td class="px-3 py-3 text-xs text-gray-600">${fmtDate(r.end) || '—'}${expired ? ' <span class="text-red-500 font-medium">(Expired)</span>' : ''}</td>
                <td class="px-3 py-3 text-right whitespace-nowrap">
                    <button data-id="${r.id}" class="edit-btn text-gray-400 hover:text-gray-700 mr-3"><i class="fas fa-pen text-xs"></i></button>
                    <button data-id="${r.id}" class="delete-btn text-gray-400 hover:text-red-600"><i class="fas fa-trash-alt text-xs"></i></button>
                </td>
            </tr>`;
        }).join('');

        rulesTbody.querySelectorAll('.toggle-btn').forEach(btn => btn.addEventListener('click', () => {
            const r = rules.find(x => x.id == btn.dataset.id);
            r.enabled = !r.enabled;
            if (r.enabled) r._expiredApplied = false;
            renderRulesTable();
        }));
        rulesTbody.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', () => openBuilder(btn.dataset.id)));
        rulesTbody.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', () => {
            if (confirm('Delete this rule?')) { rules = rules.filter(x => x.id != btn.dataset.id); renderRulesTable(); }
        }));

        bindDragReorder();
    }

    function bindDragReorder() {
        let dragEl = null;
        rulesTbody.querySelectorAll('.rule-row').forEach(row => {
            row.addEventListener('dragstart', e => {
                if (e.target.closest('button')) { e.preventDefault(); return; }
                dragEl = row; row.classList.add('dragging');
            });
            row.addEventListener('dragend', () => { row.classList.remove('dragging'); });
            row.addEventListener('dragover', e => {
                e.preventDefault();
                if (!dragEl || dragEl === row) return;
                const rect = row.getBoundingClientRect();
                const after = (e.clientY - rect.top) > rect.height / 2;
                row.parentNode.insertBefore(dragEl, after ? row.nextSibling : row);
            });
            row.addEventListener('drop', () => {
                const newOrderIds = [...rulesTbody.querySelectorAll('.rule-row')].map(r => r.dataset.id);
                rules.sort((a, b) => newOrderIds.indexOf(String(a.id)) - newOrderIds.indexOf(String(b.id)));
                renderRulesTable();
            });
        });
    }

    // ---------- builder open/close ----------
    $('add-rule-btn').addEventListener('click', () => openBuilder(null));
    document.querySelectorAll('.add-rule-trigger-' + mode).forEach(b => b.addEventListener('click', () => openBuilder(null)));
    $('builder-back-btn').addEventListener('click', closeBuilder);
    $('builder-cancel-btn').addEventListener('click', closeBuilder);

    function openBuilder(id) {
        editingId = id;
        const existing = id ? rules.find(r => r.id == id) : null;

        builderState = {
            type: existing ? existing.type : 'boost',
            terms: existing ? [...(existing.terms || [])] : [],
            collection: existing ? (existing.collection || '') : '',
            selectedProducts: new Set(existing && existing.productMode !== 'attributes' ? existing.productIds : []),
            productQuery: '',
            productMode: existing ? (existing.productMode || 'specific') : 'specific',
            groups: existing && existing.groups && existing.groups.length ? JSON.parse(JSON.stringify(existing.groups)) : [newGroup()],
            groupRelation: existing ? (existing.groupRelation || 'AND') : 'AND'
        };

        $('builder-title').textContent = existing ? 'EDIT RULE' : 'ADD A NEW RULE';
        $('rule-name').value = existing ? existing.name : '';
        $('start-date').value = existing ? existing.start : '';
        $('end-date').value = existing ? existing.end : '';
        $('market-select').value = existing ? existing.market : 'Store default';
        document.querySelectorAll(`input[name="apply-mode-${mode}"]`).forEach(r => r.checked = (r.value === (existing ? existing.applyMode : 'all')));
        if (mode === 'search') $('match-mode').value = existing ? (existing.matchMode || 'contains') : 'contains';
        if (mode === 'collection') $('collection-select').value = existing ? (existing.collection || '') : '';
        $('product-search').value = '';
        $('rule-name-error').classList.add('hidden');
        if (mode === 'search') {
            $('terms-error').classList.add('hidden');
            $('terms-duplicate-warning').classList.add('hidden');
        }
        if (mode === 'collection') $('collection-error').classList.add('hidden');
        $('products-error').classList.add('hidden');
        $('attributes-error').classList.add('hidden');
        $('group-names-error').classList.add('hidden');

        syncApplySegUI();
        updateApplyModeVisibility();
        if (mode === 'search') renderTermChips();
        renderTypeCards();
        setProductMode(builderState.productMode);
        renderProductList();
        renderSelectedChips();
        renderConditionGroups();
        updatePreviewSummary();
        revealUpTo(existing ? TOTAL_STEPS : 1);

        listScreen.classList.add('hidden');
        builderScreen.classList.remove('hidden');
    }

    function closeBuilder() {
        builderScreen.classList.add('hidden');
        listScreen.classList.remove('hidden');
    }

    // ---------- accordion step reveal ----------
    // Sections stack and stay visible once revealed. Progressive reveal only
    // happens the first time a NEW rule is created; editing shows every
    // section immediately since the rule is already complete.
    const TOTAL_STEPS = 4;
    let maxRevealedStep = 1;

    function revealUpTo(n) {
        maxRevealedStep = n;
        for (let i = 1; i <= TOTAL_STEPS; i++) {
            document.getElementById(`step-${i}-${mode}`).classList.toggle('hidden', i > n);
        }
        $('builder-save-btn').disabled = maxRevealedStep < TOTAL_STEPS;
        if (maxRevealedStep >= TOTAL_STEPS) updatePreviewSummary();
    }

    function validateStep(step) {
        if (step === 1) {
            const name = $('rule-name').value.trim();
            $('rule-name-error').classList.toggle('hidden', !!name);
            return !!name;
        }
        if (step === 3) {
            const am = document.querySelector(`input[name="apply-mode-${mode}"]:checked`).value;
            if (mode === 'search' && am === 'specific' && builderState.terms.length === 0) {
                $('terms-error').classList.remove('hidden');
                return false;
            }
            if (mode === 'collection' && am === 'specific' && !$('collection-select').value) {
                $('collection-error').classList.remove('hidden');
                return false;
            }
        }
        return true;
    }

    builderScreen.querySelectorAll('.step-continue-btn').forEach(btn => btn.addEventListener('click', () => {
        const step = Number(btn.dataset.step);
        if (!validateStep(step)) return;
        if (step + 1 > maxRevealedStep) {
            revealUpTo(step + 1);
            const next = document.getElementById(`step-${step + 1}-${mode}`);
            next.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    }));

    function syncApplySegUI() {
        document.querySelectorAll(`input[name="apply-mode-${mode}"]`).forEach(r => {
            const label = r.closest('.seg-btn');
            label.classList.toggle('active', r.checked);
            label.classList.toggle('text-gray-900', r.checked);
            label.classList.toggle('text-gray-500', !r.checked);
        });
    }
    // ---------- type cards ----------
    function renderTypeCards() {
        document.querySelectorAll('.type-card-' + mode).forEach(card => {
            const active = card.dataset.type === builderState.type;
            card.classList.remove('active-boost', 'active-demote', 'active-hide');
            if (active) card.classList.add('active-' + card.dataset.type);
            card.classList.toggle('border-gray-200', !active);
        });
        $('type-desc').textContent = c.typeDesc[builderState.type];
        updatePreviewSummary();
    }
    document.querySelectorAll('.type-card-' + mode).forEach(card => card.addEventListener('click', () => {
        builderState.type = card.dataset.type;
        renderTypeCards();
    }));

    // ---------- apply to / scope ----------
    function updateApplyModeVisibility() {
        const am = document.querySelector(`input[name="apply-mode-${mode}"]:checked`).value;
        $('specific-box').classList.toggle('hidden', am !== 'specific');
        if (mode === 'search') $('all-terms-note').classList.toggle('hidden', am !== 'all');
        if (mode === 'collection') onScopeChange();
        updatePreviewSummary();
    }
    document.querySelectorAll(`input[name="apply-mode-${mode}"]`).forEach(r => r.addEventListener('change', () => {
        syncApplySegUI();
        updateApplyModeVisibility();
    }));

    if (mode === 'collection') {
        $('collection-select').addEventListener('change', e => {
            builderState.collection = e.target.value;
            onScopeChange();
        });
    }

    function onScopeChange() {
        const am = document.querySelector(`input[name="apply-mode-${mode}"]:checked`).value;
        const scoped = getScopedProducts();
        const scopedIds = new Set(scoped.map(p => p.id));
        [...builderState.selectedProducts].forEach(id => { if (!scopedIds.has(id)) builderState.selectedProducts.delete(id); });
        const cfg = getAttrConfig(mode, scoped);
        builderState.groups.forEach(g => g.conditions.forEach(cond => {
            const conf = cfg[cond.attr];
            if (conf.options && cond.value && !conf.options.includes(cond.value)) cond.value = '';
        }));
        const note = $('scope-note');
        if (note) {
            if (am === 'specific' && !builderState.collection) note.textContent = 'Select a collection above to browse its products.';
            else if (am === 'specific') note.textContent = `Showing products from "${builderState.collection}" only.`;
            else note.textContent = 'Showing every product in your store.';
        }
        renderProductList();
        renderSelectedChips();
        renderConditionGroups();
        updatePreviewSummary();
    }

    let renderTermChips = () => {};
    if (mode === 'search') {
        renderTermChips = function() {
            const list = $('terms-chip-list');
            list.innerHTML = builderState.terms.map(t => `
                <span class="chip">${t}<button data-term="${escapeAttr(t)}" class="remove-term-btn"><i class="fas fa-times text-[9px]"></i></button></span>
            `).join('');
            list.querySelectorAll('.remove-term-btn').forEach(btn => btn.addEventListener('click', () => {
                builderState.terms = builderState.terms.filter(t => t !== btn.dataset.term);
                renderTermChips();
                updatePreviewSummary();
            }));
        };

        $('match-mode').addEventListener('change', () => { renderTermChips(); updatePreviewSummary(); });

        function addTerm() {
            const input = $('term-input');
            const raw = input.value;
            if (!raw.trim()) return;
            const parts = raw.split(',').map(s => s.trim()).filter(Boolean);
            let skipped = false;
            parts.forEach(p => {
                const exists = builderState.terms.some(t => t.toLowerCase() === p.toLowerCase());
                if (exists) skipped = true; else builderState.terms.push(p);
            });
            input.value = '';
            $('terms-duplicate-warning').classList.toggle('hidden', !skipped);
            if (parts.length) $('terms-error').classList.add('hidden');
            renderTermChips();
            updatePreviewSummary();
        }
        $('term-add-btn').addEventListener('click', addTerm);
        $('term-input').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addTerm(); } });
    }

    // ---------- product mode toggle ----------
    function syncProductModeSegUI() {
        document.querySelectorAll(`input[name="product-mode-${mode}"]`).forEach(r => {
            const label = r.closest('.seg-btn');
            label.classList.toggle('active', r.checked);
            label.classList.toggle('text-gray-900', r.checked);
            label.classList.toggle('text-gray-500', !r.checked);
        });
    }
    function setProductMode(pmode) {
        builderState.productMode = pmode;
        document.querySelectorAll(`input[name="product-mode-${mode}"]`).forEach(r => { r.checked = r.value === pmode; });
        syncProductModeSegUI();
        $('specific-products-panel').classList.toggle('hidden', pmode !== 'specific');
        $('attributes-panel').classList.toggle('hidden', pmode !== 'attributes');
        updatePreviewSummary();
    }
    document.querySelectorAll(`input[name="product-mode-${mode}"]`).forEach(r => r.addEventListener('change', () => setProductMode(r.value)));

    // ---------- product picker ----------
    $('product-search').addEventListener('input', e => {
        builderState.productQuery = e.target.value;
        renderProductList();
    });

    function renderProductList() {
        const q = builderState.productQuery.toLowerCase();
        const list = $('product-list');
        const scoped = getScopedProducts();
        const filtered = scoped.filter(p => p.name.toLowerCase().includes(q));
        const atMax = builderState.selectedProducts.size >= MAX_PRODUCTS;

        if (scoped.length === 0) {
            list.innerHTML = `<div class="text-center text-xs text-gray-400 py-8">Select a collection to see its products.</div>`;
            return;
        }
        if (filtered.length === 0) {
            list.innerHTML = `<div class="text-center text-xs text-gray-400 py-8">No products match "${builderState.productQuery}"</div>`;
            return;
        }
        list.innerHTML = filtered.map(p => {
            const checked = builderState.selectedProducts.has(p.id);
            const disabled = atMax && !checked;
            return `
            <label class="prod-row flex items-center gap-3 px-3 py-2.5 ${disabled ? 'opacity-40 cursor-not-allowed' : 'cursor-pointer'}">
                <input type="checkbox" data-id="${p.id}" class="prod-checkbox w-3.5 h-3.5 border-gray-300 rounded text-zinc-800 focus:ring-zinc-800" ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''}>
                <span class="w-8 h-8 rounded-lg shrink-0" style="background:${p.color}"></span>
                <span class="flex-1 text-xs text-gray-700 truncate">${p.name}</span>
                <span class="text-xs text-gray-400">$${p.price.toFixed(2)}</span>
            </label>`;
        }).join('');
        list.querySelectorAll('.prod-checkbox').forEach(cb => cb.addEventListener('change', () => {
            const id = Number(cb.dataset.id);
            if (cb.checked) {
                if (builderState.selectedProducts.size >= MAX_PRODUCTS) { cb.checked = false; return; }
                builderState.selectedProducts.add(id);
            } else {
                builderState.selectedProducts.delete(id);
            }
            renderSelectedChips();
            renderProductList();
            updatePreviewSummary();
        }));
    }

    function renderSelectedChips() {
        const wrap = $('selected-chips');
        const ids = [...builderState.selectedProducts];
        $('selected-count').textContent = ids.length + '/' + MAX_PRODUCTS + ' selected';
        wrap.innerHTML = ids.map(id => {
            const p = PRODUCTS.find(x => x.id === id);
            return `<span class="chip">${p.name}<button data-id="${id}" class="remove-prod-btn"><i class="fas fa-times text-[9px]"></i></button></span>`;
        }).join('');
        wrap.querySelectorAll('.remove-prod-btn').forEach(btn => btn.addEventListener('click', () => {
            builderState.selectedProducts.delete(Number(btn.dataset.id));
            renderSelectedChips();
            renderProductList();
            updatePreviewSummary();
        }));
    }

    // ---------- attribute condition groups ----------
    function renderConditionValueControl(groupId, cond) {
        const cfg = getAttrConfig(mode, getScopedProducts())[cond.attr];
        let operatorHtml = '';
        if (cfg.operators.length > 1) {
            operatorHtml = `<div class="relative shrink-0">
                <select class="cond-operator border border-gray-200 rounded-lg pl-2 pr-6 py-1.5 text-xs appearance-none bg-white" data-group="${groupId}" data-cond="${cond.id}">
                    ${cfg.operators.map(op => `<option value="${op}" ${op === cond.operator ? 'selected' : ''}>${op}</option>`).join('')}
                </select>
                <div class="absolute inset-y-0 right-0 flex items-center pr-1.5 pointer-events-none text-gray-400"><i class="fas fa-chevron-down text-[9px]"></i></div>
            </div>`;
        } else {
            operatorHtml = `<span class="text-[11px] text-gray-400 shrink-0 px-1">${cfg.operators[0]}</span>`;
        }

        let valueHtml = '';
        if (cond.attr === 'Inventory') {
            if (cond.operator === 'is') {
                valueHtml = `<select class="cond-value border border-gray-200 rounded-lg px-2 py-1.5 text-xs bg-white flex-1 min-w-0" data-group="${groupId}" data-cond="${cond.id}">
                    <option value="">Select value</option>
                    <option value="In stock" ${cond.value === 'In stock' ? 'selected' : ''}>In stock</option>
                    <option value="Out of stock" ${cond.value === 'Out of stock' ? 'selected' : ''}>Out of stock</option>
                </select>`;
            } else {
                valueHtml = `<input type="number" class="cond-value border border-gray-200 rounded-lg px-2 py-1.5 text-xs flex-1 min-w-0" placeholder="Quantity" value="${cond.value || ''}" data-group="${groupId}" data-cond="${cond.id}">`;
            }
        } else if (cond.attr === 'Price') {
            valueHtml = `<div class="relative flex-1 min-w-0">
                <span class="absolute left-2 top-1/2 -translate-y-1/2 text-xs text-gray-400">$</span>
                <input type="number" step="0.01" class="cond-value border border-gray-200 rounded-lg pl-5 pr-2 py-1.5 text-xs w-full" placeholder="0.00" value="${cond.value || ''}" data-group="${groupId}" data-cond="${cond.id}">
            </div>`;
        } else if (cond.attr === 'Date published') {
            valueHtml = `<input type="date" class="cond-value border border-gray-200 rounded-lg px-2 py-1.5 text-xs flex-1 min-w-0" value="${cond.value || ''}" data-group="${groupId}" data-cond="${cond.id}">`;
        } else if (cfg.options) {
            valueHtml = `<select class="cond-value border border-gray-200 rounded-lg px-2 py-1.5 text-xs bg-white flex-1 min-w-0" data-group="${groupId}" data-cond="${cond.id}">
                <option value="">Select value</option>
                ${cfg.options.map(o => `<option value="${o}" ${cond.value === o ? 'selected' : ''}>${o}</option>`).join('')}
            </select>`;
        } else {
            valueHtml = `<input type="text" class="cond-value border border-gray-200 rounded-lg px-2 py-1.5 text-xs flex-1 min-w-0" placeholder="Enter product title" value="${cond.value || ''}" data-group="${groupId}" data-cond="${cond.id}">`;
        }
        return operatorHtml + valueHtml;
    }

    function renderConditionRow(groupId, cond, condCount) {
        const attrKeys = Object.keys(getAttrConfig(mode, getScopedProducts()));
        return `
        <div class="flex items-center gap-2">
            <select class="attr-select border border-gray-200 rounded-lg px-2 py-1.5 text-xs bg-white w-32 shrink-0" data-group="${groupId}" data-cond="${cond.id}">
                ${attrKeys.map(a => `<option value="${a}" ${cond.attr === a ? 'selected' : ''}>${a}</option>`).join('')}
            </select>
            ${renderConditionValueControl(groupId, cond)}
            <button class="remove-cond-btn text-gray-400 hover:text-red-600 shrink-0 ${condCount <= 1 ? 'invisible' : ''}" data-group="${groupId}" data-cond="${cond.id}"><i class="fas fa-times text-xs"></i></button>
        </div>`;
    }

    function renderConditionGroups() {
        const wrap = $('condition-groups');
        let html = '';

        if (builderState.groups.length > 1) {
            html += `
            <div class="flex items-center gap-4 text-xs text-gray-600 bg-white border border-gray-100 rounded-xl px-3 py-2">
                <span class="font-medium text-gray-700">Match groups using</span>
                <label class="flex items-center gap-1.5 cursor-pointer"><input type="radio" name="group-relation-${mode}" value="AND" ${builderState.groupRelation === 'AND' ? 'checked' : ''} class="w-3.5 h-3.5 text-zinc-800 focus:ring-zinc-800"><span class="ml-1">AND</span></label>
                <label class="flex items-center gap-1.5 cursor-pointer"><input type="radio" name="group-relation-${mode}" value="OR" ${builderState.groupRelation === 'OR' ? 'checked' : ''} class="w-3.5 h-3.5 text-zinc-800 focus:ring-zinc-800"><span class="ml-1">OR</span></label>
            </div>
            <p class="text-[11px] text-gray-400"><i class="fas fa-sort mr-1"></i>Drag to reorder — higher groups are prioritized first.</p>`;
        }

        html += builderState.groups.map((g, gi) => `
            <div class="cond-group p-3 space-y-2" draggable="true" data-group-id="${g.id}">
                <div class="flex items-center gap-2">
                    <span class="group-drag-handle text-gray-300 shrink-0"><i class="fas fa-grip-vertical text-xs"></i></span>
                    <span class="w-5 h-5 rounded-full bg-white border border-gray-200 text-gray-500 text-[10px] font-bold flex items-center justify-center shrink-0">${gi + 1}</span>
                    <input type="text" class="group-name-input flex-1 min-w-0 text-xs font-semibold text-gray-700 bg-transparent border-b border-dashed border-gray-300 focus:border-gray-500 outline-none px-0.5 py-0.5" data-group="${g.id}" value="${escapeAttr(g.name)}" maxlength="40" placeholder="Group name">
                    ${builderState.groups.length > 1 ? `<button class="remove-group-btn text-gray-400 hover:text-red-600 shrink-0" data-group="${g.id}"><i class="fas fa-trash-alt text-xs"></i></button>` : ''}
                </div>
                <p class="group-name-error hidden text-[10px] text-red-600 pl-7" data-group="${g.id}">Already used by another group.</p>
                <div class="space-y-2 pl-7">
                    ${g.conditions.map(cond => renderConditionRow(g.id, cond, g.conditions.length)).join('')}
                </div>
                ${g.conditions.length < MAX_CONDITIONS_PER_GROUP ? `<button class="add-cond-btn text-xs text-blue-600 font-medium hover:underline pl-7" data-group="${g.id}"><i class="fas fa-plus mr-1"></i>And attribute</button>` : ''}
            </div>
        `).join('');

        html += `<button id="add-group-btn-${mode}" type="button" class="text-xs text-blue-600 font-medium hover:underline block"><i class="fas fa-plus mr-1"></i>Add new group</button>`;

        wrap.innerHTML = html;
        bindConditionEvents();
        bindGroupDragReorder();
    }

    function checkGroupNameDuplicate(groupId) {
        const g = builderState.groups.find(x => x.id == groupId);
        if (!g) return false;
        const name = g.name.trim().toLowerCase();
        if (!name) return true;
        return builderState.groups.some(o => o.id !== g.id && o.name.trim().toLowerCase() === name);
    }

    function refreshGroupNameValidation() {
        const wrap = $('condition-groups');
        builderState.groups.forEach(g => {
            const dup = checkGroupNameDuplicate(g.id);
            const inp = wrap.querySelector(`.group-name-input[data-group="${g.id}"]`);
            const err = wrap.querySelector(`.group-name-error[data-group="${g.id}"]`);
            if (inp) inp.classList.toggle('name-duplicate', dup);
            if (err) err.classList.toggle('hidden', !dup);
        });
    }

    function groupNamesAreValid() {
        const names = builderState.groups.map(g => g.name.trim().toLowerCase());
        if (names.some(n => !n)) return false;
        return new Set(names).size === names.length;
    }

    function bindGroupDragReorder() {
        const wrap = $('condition-groups');
        let dragEl = null;
        wrap.querySelectorAll('.cond-group').forEach(row => {
            row.addEventListener('dragstart', e => {
                if (e.target.closest('input, select, textarea, button')) { e.preventDefault(); return; }
                dragEl = row; row.classList.add('dragging');
            });
            row.addEventListener('dragend', () => { row.classList.remove('dragging'); });
            row.addEventListener('dragover', e => {
                e.preventDefault();
                if (!dragEl || dragEl === row) return;
                const rect = row.getBoundingClientRect();
                const after = (e.clientY - rect.top) > rect.height / 2;
                row.parentNode.insertBefore(dragEl, after ? row.nextSibling : row);
            });
            row.addEventListener('drop', () => {
                const newOrderIds = [...wrap.querySelectorAll('.cond-group')].map(r => r.dataset.groupId);
                builderState.groups.sort((a, b) => newOrderIds.indexOf(String(a.id)) - newOrderIds.indexOf(String(b.id)));
                renderConditionGroups();
                updatePreviewSummary();
            });
        });
    }

    function bindConditionEvents() {
        const wrap = $('condition-groups');

        wrap.querySelectorAll('.group-name-input').forEach(inp => inp.addEventListener('input', () => {
            const g = builderState.groups.find(x => x.id == inp.dataset.group);
            g.name = inp.value;
            refreshGroupNameValidation();
            updatePreviewSummary();
        }));

        document.getElementById('add-group-btn-' + mode)?.addEventListener('click', () => {
            builderState.groups.push(newGroup(builderState.groups));
            renderConditionGroups();
            updatePreviewSummary();
        });

        wrap.querySelectorAll('.attr-select').forEach(sel => sel.addEventListener('change', () => {
            const g = builderState.groups.find(x => x.id == sel.dataset.group);
            const cond = g.conditions.find(x => x.id == sel.dataset.cond);
            cond.attr = sel.value;
            cond.operator = getAttrConfig(mode, getScopedProducts())[cond.attr].operators[0];
            cond.value = '';
            renderConditionGroups();
            updatePreviewSummary();
        }));

        wrap.querySelectorAll('.cond-operator').forEach(sel => sel.addEventListener('change', () => {
            const g = builderState.groups.find(x => x.id == sel.dataset.group);
            const cond = g.conditions.find(x => x.id == sel.dataset.cond);
            cond.operator = sel.value;
            cond.value = '';
            renderConditionGroups();
            updatePreviewSummary();
        }));

        wrap.querySelectorAll('.cond-value').forEach(el => {
            el.addEventListener('input', () => {
                const g = builderState.groups.find(x => x.id == el.dataset.group);
                const cond = g.conditions.find(x => x.id == el.dataset.cond);
                cond.value = el.value;
                updatePreviewSummary();
            });
            el.addEventListener('change', () => {
                const g = builderState.groups.find(x => x.id == el.dataset.group);
                const cond = g.conditions.find(x => x.id == el.dataset.cond);
                cond.value = el.value;
                updatePreviewSummary();
            });
        });

        wrap.querySelectorAll('.remove-cond-btn').forEach(btn => btn.addEventListener('click', () => {
            const g = builderState.groups.find(x => x.id == btn.dataset.group);
            if (g.conditions.length <= 1) return;
            g.conditions = g.conditions.filter(cond => cond.id != btn.dataset.cond);
            renderConditionGroups();
            updatePreviewSummary();
        }));

        wrap.querySelectorAll('.add-cond-btn').forEach(btn => btn.addEventListener('click', () => {
            const g = builderState.groups.find(x => x.id == btn.dataset.group);
            g.conditions.push(newCondition());
            renderConditionGroups();
            updatePreviewSummary();
        }));

        wrap.querySelectorAll('.remove-group-btn').forEach(btn => btn.addEventListener('click', () => {
            if (builderState.groups.length <= 1) return;
            builderState.groups = builderState.groups.filter(g => g.id != btn.dataset.group);
            renderConditionGroups();
            updatePreviewSummary();
        }));

        wrap.querySelectorAll(`input[name="group-relation-${mode}"]`).forEach(r => r.addEventListener('change', () => {
            builderState.groupRelation = r.value;
            updatePreviewSummary();
        }));
    }

    function attributesAreComplete() {
        return builderState.groups.every(g => g.conditions.every(cond => String(cond.value ?? '').trim() !== ''));
    }

    // ---------- preview ----------
    function updatePreviewSummary() {
        const meta = TYPE_META[builderState.type];
        let contextText;
        if (mode === 'search') {
            const am = document.querySelector(`input[name="apply-mode-${mode}"]:checked`)?.value || 'all';
            if (am === 'specific') {
                const mm = $('match-mode').value === 'is' ? 'is exactly' : 'contains';
                contextText = builderState.terms.length ? `a search term that ${mm} ${builderState.terms.map(t => '"' + t + '"').join(', ')}` : '(no terms added yet)';
            } else {
                contextText = 'any search term';
            }
        } else {
            const am = document.querySelector(`input[name="apply-mode-${mode}"]:checked`)?.value || 'all';
            contextText = am === 'specific' ? (builderState.collection || '(no collection selected)') : 'all collection pages';
        }

        let productText;
        if (builderState.productMode === 'specific') {
            const count = builderState.selectedProducts.size;
            productText = `<strong>${count}</strong> selected product${count === 1 ? '' : 's'}`;
        } else {
            const groupCount = builderState.groups.length;
            const relation = groupCount > 1 ? ` (matched ${builderState.groupRelation === 'AND' ? 'across all' : 'in any'} group${groupCount === 1 ? '' : 's'})` : '';
            productText = `products matching <strong>${groupCount}</strong> attribute condition group${groupCount === 1 ? '' : 's'}${relation}`;
        }

        const verb = `${meta.label.toLowerCase()}${builderState.type === 'hide' ? 'n' : 'ed'}`;
        const sentence = mode === 'search'
            ? `When a shopper searches with ${contextText}, ${productText} will be <strong>${verb}</strong>.`
            : `On <strong>${contextText}</strong>, ${productText} will be <strong>${verb}</strong>.`;

        $('preview-summary').innerHTML = `<i class="fas fa-info-circle mr-1 text-gray-400"></i> ${sentence}`;
    }

    // ---------- save ----------
    $('builder-save-btn').addEventListener('click', () => {
        const name = $('rule-name').value.trim();
        const am = document.querySelector(`input[name="apply-mode-${mode}"]:checked`).value;

        let valid = true;
        $('rule-name-error').classList.toggle('hidden', !!name);
        if (!name) valid = false;

        if (mode === 'search') {
            if (am === 'specific' && builderState.terms.length === 0) {
                $('terms-error').classList.remove('hidden');
                valid = false;
            } else {
                $('terms-error').classList.add('hidden');
            }
        }
        if (mode === 'collection') {
            if (am === 'specific' && !$('collection-select').value) {
                $('collection-error').classList.remove('hidden');
                valid = false;
            } else {
                $('collection-error').classList.add('hidden');
            }
        }

        if (builderState.productMode === 'specific') {
            $('attributes-error').classList.add('hidden');
            $('group-names-error').classList.add('hidden');
            if (builderState.selectedProducts.size === 0) {
                $('products-error').classList.remove('hidden');
                valid = false;
            } else {
                $('products-error').classList.add('hidden');
            }
        } else {
            $('products-error').classList.add('hidden');
            if (!groupNamesAreValid()) {
                $('group-names-error').classList.remove('hidden');
                refreshGroupNameValidation();
                valid = false;
            } else {
                $('group-names-error').classList.add('hidden');
            }
            if (!attributesAreComplete()) {
                $('attributes-error').classList.remove('hidden');
                valid = false;
            } else {
                $('attributes-error').classList.add('hidden');
            }
        }

        if (!valid) return;

        const payload = {
            type: builderState.type,
            name,
            start: $('start-date').value,
            end: $('end-date').value,
            market: $('market-select').value,
            applyMode: am,
            productMode: builderState.productMode,
            productIds: builderState.productMode === 'specific' ? [...builderState.selectedProducts] : [],
            groups: builderState.productMode === 'attributes' ? JSON.parse(JSON.stringify(builderState.groups)) : [],
            groupRelation: builderState.groupRelation,
            _expiredApplied: false
        };
        if (mode === 'search') {
            payload.matchMode = $('match-mode').value;
            payload.terms = am === 'specific' ? [...builderState.terms] : [];
        }
        if (mode === 'collection') {
            payload.collection = am === 'specific' ? $('collection-select').value : '';
        }

        if (editingId) {
            const idx = rules.findIndex(r => r.id == editingId);
            rules[idx] = { ...rules[idx], ...payload };
        } else {
            rules.push({ id: nextId++, enabled: true, ...payload });
        }

        closeBuilder();
        renderRulesTable();
    });

    // ---------- init ----------
    renderRulesTable();
}

// ==================== PAGE TAB SWITCH ====================
document.getElementById('app-search').innerHTML = pageTemplate('search');
document.getElementById('app-collection').innerHTML = pageTemplate('collection');
initApp('search');
initApp('collection');

const pageTabBtns = document.querySelectorAll('.page-tab-btn');
function setPageTab(page) {
    pageTabBtns.forEach(b => {
        const active = b.dataset.page === page;
        b.classList.toggle('active', active);
        b.classList.toggle('text-gray-900', active);
        b.classList.toggle('text-gray-500', !active);
    });
    document.querySelectorAll('.page-panel').forEach(p => p.classList.add('hidden'));
    document.getElementById('app-' + page).classList.remove('hidden');
}
pageTabBtns.forEach(b => b.addEventListener('click', () => setPageTab(b.dataset.page)));
setPageTab('collection');
</script>
